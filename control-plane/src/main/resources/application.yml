server:
  port: 8080
  tomcat:
    max-http-form-post-size: 12MB
    max-swallow-size: 12MB

spring:
  application:
    name: control-plane
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/aegistrace}
    username: ${POSTGRES_USER:aegis}
    password: ${POSTGRES_PASSWORD:aegis}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: control-plane
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

aegis:
  jwt-secret: ${AEGIS_JWT_SECRET:change-me-jwt-secret-at-least-32-bytes}
  internal-token: ${AEGIS_INTERNAL_TOKEN:change-me-internal-token}
  runtime-url: ${AEGIS_RUNTIME_URL:http://localhost:8090}
  seed-enabled: ${AEGIS_SEED_ENABLED:false}
  seed-password: ${AEGIS_SEED_PASSWORD:change-me-dev-password}
  environment: ${AEGIS_ENVIRONMENT:dev}
  failure-simulation-enabled: ${AEGIS_FAILURE_SIMULATION:true}
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
  cookie-secure: ${AEGIS_COOKIE_SECURE:false}
  jaeger-query-url: ${JAEGER_QUERY_URL:}
  jaeger-public-url: ${JAEGER_PUBLIC_URL:http://localhost:16686}
  prometheus-url: ${PROMETHEUS_URL:}
  redis:
    enabled: ${REDIS_ENABLED:false}
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
  s3:
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:aegistrace-documents}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}

springdoc:
  swagger-ui:
    path: /swagger-ui
