[project]
name = "aegislib"
version = "0.1.0"
description = "Shared retrieval, grounding, planning, and retry rules for AegisTrace"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.2"]
service = ["fastapi>=0.115", "uvicorn>=0.32", "httpx>=0.27", "psycopg[binary]>=3.2", "pypdf>=5.0", "boto3>=1.35"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
